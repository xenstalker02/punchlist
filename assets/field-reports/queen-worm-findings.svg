<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="972" viewBox="0 0 1280 972" role="img" aria-labelledby="title description">
  <title id="title">Queen Worm audit: seven named findings and three taxonomy gaps</title>
  <desc id="description">A browsing-journey graph. Shared findings are hidden keyboard focus, faint secondary text, and long supporting lines. The photograph stage adds loading silence and a skipped heading level. The basket stage adds an undisclosed temporary basket and false success at the quantity limit. Dashed gap nodes identify landscape window fit, squeezed mobile basket text, and lost focus after removal. Ratings belong to the original single-agent audit; gap nodes are not additional named defects.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526273"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #10233d; }
      .stage { fill: #10233d; }
      .stage-label { fill: #fff; font-size: 22px; font-weight: 700; }
      .finding { fill: #f1f5f9; stroke: #2457d6; stroke-width: 2; }
      .gap { fill: #faf8fd; stroke: #7353ba; stroke-width: 2; stroke-dasharray: 7 5; }
      .label { font-size: 20px; font-weight: 700; }
      .code { font-size: 15px; fill: #526273; }
      .rating { font-size: 16px; font-weight: 700; fill: #2457d6; }
      .gap-label { font-size: 16px; font-weight: 700; fill: #7353ba; }
      .connector { fill: none; stroke: #a3adba; stroke-width: 2; }
      .note { font-size: 17px; fill: #526273; }
    </style>
  </defs>
  <rect width="1280" height="972" fill="#fff"/>
  <text x="48" y="59" font-size="34" font-weight="700">Queen Worm · audit map</text>
  <text x="48" y="92" class="note">Original observations · 9 September 2026 · single-agent heuristic review</text>

  <rect x="48" y="119" width="22" height="18" class="finding"/>
  <text x="82" y="134" class="note">Named finding · original severity /4</text>
  <rect x="538" y="119" width="22" height="18" class="gap"/>
  <text x="572" y="134" class="note">Taxonomy gap · no original severity score</text>

  <path d="M404 202H456" stroke="#526273" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M820 202H872" stroke="#526273" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g id="journey-browse">
    <rect x="48" y="174" width="352" height="56" rx="4" class="stage"/>
    <text x="72" y="209" class="stage-label">1 · Browse and navigate</text>
  </g>
  <g id="journey-photo">
    <rect x="464" y="174" width="352" height="56" rx="4" class="stage"/>
    <text x="488" y="209" class="stage-label">2 · Inspect a photograph</text>
  </g>
  <g id="journey-basket">
    <rect x="880" y="174" width="352" height="56" rx="4" class="stage"/>
    <text x="904" y="209" class="stage-label">3 · Review the basket</text>
  </g>

  <path class="connector" d="M224 230V254H64V580H96M64 332H96M64 456H96"/>
  <path class="connector" d="M640 230V254H480V680H512M480 332H512M480 456H512"/>
  <path class="connector" d="M1056 230V254H896V804H928M896 332H928M896 456H928M896 680H928"/>

  <g id="f-4914391b09d2">
    <title>F1: keyboard-dead-zone; f-4914391b09d2; original rating 3/4</title>
    <rect x="96" y="284" width="304" height="96" rx="4" class="finding"/>
    <text x="112" y="310" class="rating">F1 <tspan x="384" text-anchor="end">3/4</tspan></text>
    <text x="112" y="340" class="label">Hidden keyboard focus</text>
    <text x="112" y="364" class="code">keyboard-dead-zone</text>
  </g>
  <g id="f-0009746bbf55">
    <title>F2: vanishing-ink; f-0009746bbf55; original rating 2/4</title>
    <rect x="96" y="408" width="304" height="96" rx="4" class="finding"/>
    <text x="112" y="434" class="rating">F2 <tspan x="384" text-anchor="end">2/4</tspan></text>
    <text x="112" y="464" class="label">Faint secondary text</text>
    <text x="112" y="488" class="code">vanishing-ink</text>
  </g>
  <g id="f-8c45d9b7abdd">
    <title>F6: marathon-measure; f-8c45d9b7abdd; original rating 1/4</title>
    <rect x="96" y="532" width="304" height="96" rx="4" class="finding"/>
    <text x="112" y="558" class="rating">F6 <tspan x="384" text-anchor="end">1/4</tspan></text>
    <text x="112" y="588" class="label">Long supporting lines</text>
    <text x="112" y="612" class="code">marathon-measure</text>
  </g>

  <g id="f-3391dd362497">
    <title>F3: silent-stall; f-3391dd362497; original rating 2/4</title>
    <rect x="512" y="284" width="304" height="96" rx="4" class="finding"/>
    <text x="528" y="310" class="rating">F3 <tspan x="800" text-anchor="end">2/4</tspan></text>
    <text x="528" y="340" class="label">Loading without feedback</text>
    <text x="528" y="364" class="code">silent-stall</text>
  </g>
  <g id="f-2107a1268d08">
    <title>F7: painted-on-headings; f-2107a1268d08; original rating 1/4</title>
    <rect x="512" y="408" width="304" height="96" rx="4" class="finding"/>
    <text x="528" y="434" class="rating">F7 <tspan x="800" text-anchor="end">1/4</tspan></text>
    <text x="528" y="464" class="label">Skipped section heading</text>
    <text x="528" y="488" class="code">painted-on-headings</text>
  </g>
  <g id="g-landscape-window-fit">
    <title>G2: g-landscape-window-fit; taxonomy gap</title>
    <rect x="512" y="632" width="304" height="96" rx="4" class="gap"/>
    <text x="528" y="658" class="gap-label">G2 · Taxonomy gap</text>
    <text x="528" y="688" class="label">Landscape window fit</text>
    <text x="528" y="712" class="code">Controls below the taskbar</text>
  </g>

  <g id="f-3c12fcc4d317">
    <title>F4: amnesiac-relaunch; f-3c12fcc4d317; original rating 2/4</title>
    <rect x="928" y="284" width="304" height="96" rx="4" class="finding"/>
    <text x="944" y="310" class="rating">F4 <tspan x="1216" text-anchor="end">2/4</tspan></text>
    <text x="944" y="340" class="label">Undisclosed save failure</text>
    <text x="944" y="364" class="code">amnesiac-relaunch</text>
  </g>
  <g id="f-2f15498d4644">
    <title>F5: celebrated-no-op; f-2f15498d4644; original rating 1/4</title>
    <rect x="928" y="408" width="304" height="96" rx="4" class="finding"/>
    <text x="944" y="434" class="rating">F5 <tspan x="1216" text-anchor="end">1/4</tspan></text>
    <text x="944" y="464" class="label">False success at the cap</text>
    <text x="944" y="488" class="code">celebrated-no-op</text>
  </g>
  <g id="g-mobile-basket-layout">
    <title>G1: g-mobile-basket-layout; taxonomy gap</title>
    <rect x="928" y="632" width="304" height="96" rx="4" class="gap"/>
    <text x="944" y="658" class="gap-label">G1 · Taxonomy gap</text>
    <text x="944" y="688" class="label">Squeezed basket text</text>
    <text x="944" y="712" class="code">Title and variant lose width</text>
  </g>
  <g id="g-basket-removal-focus">
    <title>G3: g-basket-removal-focus; taxonomy gap</title>
    <rect x="928" y="756" width="304" height="96" rx="4" class="gap"/>
    <text x="944" y="782" class="gap-label">G3 · Taxonomy gap</text>
    <text x="944" y="812" class="label">Lost focus after removal</text>
    <text x="944" y="836" class="code">No useful next control</text>
  </g>

  <path d="M48 883H1232" stroke="#d7dde5"/>
  <text x="48" y="912" class="note">F1, F2, and F6 are shared-surface findings: they also affect relevant photograph and basket screens.</text>
  <text x="48" y="940" class="note">This diagram summarizes the historical audit. Finding IDs, evidence, and later repair limits are in the field report.</text>
</svg>
