name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate taxonomy and repository claims
        run: python scripts/validate.py
      - name: Prove invalid entries fail
        run: python -m unittest discover -s tests -v
